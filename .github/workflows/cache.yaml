name: "Cache Warming"

on:
  push:
    branches:
      - main
    paths:
      - "apps/client/src-tauri/Cargo.lock"
      - "apps/client/src-tauri/Cargo.toml"
      - "apps/client/src-tauri/src/**"
      - "apps/client/src-tauri/build.rs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/actions/setup-env/**"
      - ".github/workflows/cache.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    runs-on: "ubuntu-22.04"
    name: Warm Cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          setup-tauri: "true"

      - name: Build client
        run: pnpm build --filter @clipboard-sync/client

      - name: Check client
        run: pnpm check --filter @clipboard-sync/client
